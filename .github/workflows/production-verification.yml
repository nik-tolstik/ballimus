name: Production verification

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-verification
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  statuses: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Production
    env:
      GH_TOKEN: ${{ github.token }}
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      PRODUCTION_VERIFY_CONFIG: .env.production.local.example
      PRODUCTION_VERIFY_SHA: ${{ github.sha }}
      PRODUCTION_WEB_URL: ${{ vars.PRODUCTION_WEB_URL }}
      PRODUCTION_API_URL: ${{ vars.PRODUCTION_API_URL }}
      RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
      RAILWAY_ENVIRONMENT: ${{ vars.RAILWAY_ENVIRONMENT }}
      RAILWAY_API_SERVICE: ${{ vars.RAILWAY_API_SERVICE }}
      RAILWAY_JOBS_SERVICE: ${{ vars.RAILWAY_JOBS_SERVICE }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Configure Railway SSH identity
        env:
          RAILWAY_SSH_PRIVATE_KEY: ${{ secrets.RAILWAY_SSH_PRIVATE_KEY }}
        run: |
          test -n "$RAILWAY_SSH_PRIVATE_KEY"
          identity_file="$RUNNER_TEMP/railway-ci"
          printf '%s\n' "$RAILWAY_SSH_PRIVATE_KEY" > "$identity_file"
          chmod 600 "$identity_file"
          printf 'RAILWAY_SSH_IDENTITY_FILE=%s\n' "$identity_file" >> "$GITHUB_ENV"
      - name: Wait for exact production deployments
        run: pnpm release:wait-production
      - name: Verify production
        run: pnpm release:verify-production
