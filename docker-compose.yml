name: football-bot-local

services:
  postgres:
    image: postgres:18.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-football_local}
      POSTGRES_USER: ${POSTGRES_USER:-football_local}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-football_local_dev_password}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - football_postgres_local:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready --username="$${POSTGRES_USER}" --dbname="$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  football_postgres_local:
    name: football-bot-local-postgres-data
